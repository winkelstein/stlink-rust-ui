name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # Universal binary: both Apple targets.
            targets: aarch64-apple-darwin x86_64-apple-darwin
            bundle_args: --target universal-apple-darwin
            bundle_dir: target/universal-apple-darwin/release/bundle
          - name: Windows
            os: windows-latest
            targets: ""
            bundle_args: ""
            bundle_dir: target/release/bundle
          - name: Linux
            os: ubuntu-22.04
            targets: ""
            bundle_args: --bundles appimage,deb
            bundle_dir: target/release/bundle
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Linux packages (Tauri 2, nusb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libudev-dev libxdo-dev libssl-dev build-essential file

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          for t in ${{ matrix.targets }}; do rustup target add "$t"; done
          rustc --version

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: npm ci
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Build the app
        shell: bash
        run: npm run tauri build -- ${{ matrix.bundle_args }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: stlink-rust-ui-${{ matrix.name }}
          path: |
            ${{ matrix.bundle_dir }}/dmg/*.dmg
            ${{ matrix.bundle_dir }}/macos/*.app
            ${{ matrix.bundle_dir }}/msi/*.msi
            ${{ matrix.bundle_dir }}/nsis/*.exe
            ${{ matrix.bundle_dir }}/appimage/*.AppImage
            ${{ matrix.bundle_dir }}/deb/*.deb
          if-no-files-found: error
