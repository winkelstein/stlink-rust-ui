[workspace]
resolver = "3"
members = ["stlink", "stlink-cli"]
# GUI (Этап 2) пока вне workspace, чтобы `cargo check --workspace` не собирал Tauri.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
stlink = { path = "stlink" }
nusb = "0.2.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
panic = "abort"
