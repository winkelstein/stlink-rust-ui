name: Release

# A tag vX.Y.Z (or vX.Y.Z-rc.N / -beta.N, published as a prerelease) builds
# the app installers and stlink-cli on three OSes, then publishes a GitHub
# Release with SHA256SUMS.txt and the same files as an OCI artifact in GHCR.
#
# Dry runs build everything but publish nothing (files only as workflow
# artifacts): manually (Run workflow, dry_run on) or automatically when this
# workflow or the version scripts change on main. A dry run writes the tag's
# version into the version files of its working copy (never committed), so a
# prerelease build is exercised end to end.
#
# Re-running on the same tag is safe: the release is reused, assets are
# replaced, the GHCR tag is pushed again.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/check-version.mjs
      - scripts/set-version.mjs
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.1-rc.1
        required: true
      dry_run:
        description: Build only; no GitHub Release, no GHCR
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      wix_version: ${{ steps.v.outputs.wix_version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - id: v
        name: Tag, version, prerelease
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"; dry=false
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$INPUT_TAG"; dry="$INPUT_DRY_RUN"
          else
            # Push to main touching the release files: dry run of a prerelease.
            tag="v$(node -p 'require("./package.json").version')-rc.$GITHUB_RUN_NUMBER"; dry=true
          fi
          if [[ "$dry" == true ]]; then
            node scripts/set-version.mjs "$tag"
          fi
          # Fails before anything is built when the tag and the files differ.
          node scripts/check-version.mjs "$tag"
          version="${tag#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          # MSI needs a numeric version: X.Y.Z.N with N from -rc.N / -beta.N.
          base="${version%%-*}"
          build=0
          if [[ "$version" == *-* ]]; then
            n="${version##*[!0-9]}"
            build="${n:-0}"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "dry_run=$dry"
            echo "wix_version=$base.$build"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$tag (version $version, prerelease $prerelease, dry run $dry, MSI $base.$build)"

  app:
    name: App ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle_dir: target/universal-apple-darwin/release/bundle
          - name: Windows
            os: windows-latest
            targets: ""
            args: ""
            bundle_dir: target/release/bundle
          - name: Linux
            os: ubuntu-22.04
            targets: ""
            args: --bundles appimage,deb
            bundle_dir: target/release/bundle
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Linux packages (Tauri 2, nusb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libudev-dev libxdo-dev libssl-dev build-essential file

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          for t in ${{ matrix.targets }}; do rustup target add "$t"; done

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-app-${{ matrix.name }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Dry run version
        if: needs.version.outputs.dry_run == 'true'
        run: node scripts/set-version.mjs "${{ needs.version.outputs.tag }}"

      - run: npm ci

      # Optional signing: each block runs only when its secrets are set (see
      # docs/release.md). Without them macOS gets the ad-hoc signature from
      # tauri.macos.conf.json and Windows installers are unsigned.
      - name: Apple signing and notarization (if configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Signing with $APPLE_SIGNING_IDENTITY"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
              echo "Notarization on"
            fi
          else
            echo "No Apple certificate: ad-hoc signature"
          fi

      - name: Windows config (MSI version, optional code signing)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WIX_VERSION: ${{ needs.version.outputs.wix_version }}
        run: |
          $windows = @{ wix = @{ version = $env:WIX_VERSION } }
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            Remove-Item $pfx
            $windows.certificateThumbprint = $cert.Thumbprint
            $windows.digestAlgorithm = "sha256"
            $windows.timestampUrl = "http://timestamp.digicert.com"
            Write-Output "Signing with $($cert.Subject)"
          } else {
            Write-Output "No Windows certificate: unsigned installers"
          }
          $file = Join-Path $env:RUNNER_TEMP "tauri.release.json"
          @{ bundle = @{ windows = $windows } } | ConvertTo-Json -Depth 6 | Set-Content -Path $file
          # Forward slashes: the build step runs in bash, which would eat backslashes.
          "TAURI_EXTRA_ARGS=--config $($file -replace '\\', '/')" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Content $file

      - name: Build the app
        shell: bash
        run: npm run tauri build -- ${{ matrix.args }} ${{ env.TAURI_EXTRA_ARGS }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          for f in "${{ matrix.bundle_dir }}"/dmg/*.dmg "${{ matrix.bundle_dir }}"/msi/*.msi \
                   "${{ matrix.bundle_dir }}"/nsis/*.exe "${{ matrix.bundle_dir }}"/appimage/*.AppImage \
                   "${{ matrix.bundle_dir }}"/deb/*.deb; do
            [ -f "$f" ] && cp "$f" out/
          done
          ls -l out
          [ -n "$(ls out)" ]

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-app-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  cli:
    name: CLI ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            suffix: macos-universal
          - name: Windows
            os: windows-latest
            suffix: windows-x86_64
          - name: Linux
            os: ubuntu-22.04
            suffix: linux-x86_64
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Linux packages (nusb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-cli-${{ matrix.name }}

      - uses: actions/setup-node@v7.1.0
        if: needs.version.outputs.dry_run == 'true'
        with:
          node-version: 22

      - name: Dry run version
        if: needs.version.outputs.dry_run == 'true'
        run: node scripts/set-version.mjs "${{ needs.version.outputs.tag }}"

      - name: Build and package stlink-cli
        shell: bash
        env:
          NAME: stlink-cli-${{ needs.version.outputs.version }}-${{ matrix.suffix }}
        run: |
          mkdir -p "pkg/$NAME" out
          cp LICENSE-MIT LICENSE-APACHE README.md "pkg/$NAME/"
          case "$RUNNER_OS" in
            macOS)
              cargo build --release -p stlink-cli --target aarch64-apple-darwin
              cargo build --release -p stlink-cli --target x86_64-apple-darwin
              lipo -create -output "pkg/$NAME/stlink-cli" \
                target/aarch64-apple-darwin/release/stlink-cli target/x86_64-apple-darwin/release/stlink-cli
              lipo -archs "pkg/$NAME/stlink-cli"
              tar -C pkg -czf "out/$NAME.tar.gz" "$NAME"
              ;;
            Windows)
              cargo build --release -p stlink-cli
              cp target/release/stlink-cli.exe "pkg/$NAME/"
              (cd pkg && 7z a -tzip "../out/$NAME.zip" "$NAME")
              ;;
            Linux)
              cargo build --release -p stlink-cli
              cp target/release/stlink-cli "pkg/$NAME/"
              tar -C pkg -czf "out/$NAME.tar.gz" "$NAME"
              ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-cli-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [version, app, cli]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: |
          rm -f SHA256SUMS.txt
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Dry run result
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dry-run-${{ needs.version.outputs.version }}
          path: assets/*

      - name: Create or reuse the release, upload, publish
        if: env.DRY_RUN != 'true'
        run: |
          repo="$GITHUB_REPOSITORY"
          id="$(gh api "repos/$repo/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)"
          if [ -z "$id" ]; then
            header="$(printf '%s\n\n%s\n%s\n' \
              "Installers for macOS (universal), Windows and Linux, and \`stlink-cli\` binaries. Verify downloads with \`SHA256SUMS.txt\`." \
              "- Install: https://github.com/$repo#install" \
              "- Windows drivers: https://github.com/$repo/blob/main/docs/windows.md")"
            id="$(gh api "repos/$repo/releases" \
              -f tag_name="$TAG" -f name="stlink-rust-ui $TAG" -f body="$header" \
              -F draft=true -F prerelease="$PRERELEASE" -F generate_release_notes=true --jq .id)"
            echo "created draft release $id"
          else
            echo "reusing release $id"
          fi
          # --clobber replaces assets of a previous run.
          gh release upload "$TAG" assets/* --clobber --repo "$repo"
          gh api -X PATCH "repos/$repo/releases/$id" -F draft=false -F prerelease="$PRERELEASE" --jq .html_url

  ghcr:
    name: GitHub Packages (GHCR)
    needs: [version, publish]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - uses: oras-project/setup-oras@v2.0.2

      - name: Push the release files as an OCI artifact
        working-directory: assets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum -- * > SHA256SUMS.txt
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          files=()
          for f in *; do files+=("$f:application/octet-stream"); done
          oras push "$image:$VERSION" \
            --artifact-type application/vnd.stlink-rust-ui.release.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.licenses=MIT OR Apache-2.0" \
            --annotation "org.opencontainers.image.title=stlink-rust-ui" \
            --annotation "org.opencontainers.image.description=stlink-rust-ui installers, stlink-cli binaries and SHA256SUMS.txt" \
            "${files[@]}"
          if [ "$PRERELEASE" != true ]; then
            oras tag "$image:$VERSION" latest
          fi
          echo "pushed $image:$VERSION"
