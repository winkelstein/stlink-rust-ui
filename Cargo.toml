[workspace]
resolver = "3"
members = ["stlink", "stlink-cli", "src-tauri"]

[workspace.package]
version = "0.1.1-rc.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
stlink = { path = "stlink" }
nusb = "0.2.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
futures-lite = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Profiles of workspace members are ignored: the Tauri app's release profile lives here.
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
